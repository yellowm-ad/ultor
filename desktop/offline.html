<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>마법학교 울토르</title>
<style>
  html, body { height: 100%; margin: 0; background: #0b0a10; color: #eadfc6; font-family: 'Malgun Gothic', sans-serif; }
  body { display: flex; align-items: center; justify-content: center; }
  .box { text-align: center; padding: 32px 40px; border: 2px solid #b8955a; border-radius: 12px; background: #17141f; }
  h1 { margin: 0 0 12px; font-size: 22px; color: #e4c78a; }
  p { margin: 0 0 20px; font-size: 14px; line-height: 1.6; color: #cfc4ad; }
  button { font: inherit; font-size: 14px; padding: 8px 22px; border-radius: 8px; border: 1px solid #b8955a; background: #2a2335; color: #eadfc6; cursor: pointer; }
  button:hover { background: #3a3048; }
</style>
</head>
<body>
  <div class="box">
    <h1>서버에 연결할 수 없습니다</h1>
    <p>울토르는 지금 온라인으로 실행됩니다.<br />인터넷 연결을 확인한 뒤 다시 시도해 주세요. (F5)</p>
    <button id="retry">다시 시도</button>
  </div>
  <script>
    const url = new URLSearchParams(location.search).get('url') || 'https://ultor-web.vercel.app'
    document.getElementById('retry').onclick = () => { location.href = url }
  </script>
</body>
</html>
